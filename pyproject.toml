[project]
name = "temporal-k8s-operator"
version = "0.0"
requires-python = ">=3.10,<3.13"

[tool.bandit]
exclude_dirs = ["/venv/"]

[tool.bandit.assert_used]
skips = ["*/*test.py", "*/test_*.py", "*tests/*.py"]

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

# Formatting tools configuration
[tool.black]
line-length = 120
# Black does not support py312, use py311
target-version = ["py311"]

[tool.isort]
profile = "black"

# Linting tools configuration
[tool.flake8]
max-line-length = 120
max-doc-length = 99
max-complexity = 10
exclude = [".git", "__pycache__", ".tox", "build", "dist", "*.egg_info", "venv"]
select = ["E", "W", "F", "C", "N", "R", "D", "H"]
ignore = ["W503", "E501", "D107"]
per-file-ignores = ["tests/*:D100,D101,D102,D103,D104"]
docstring-convention = "google"
copyright-check = "True"
copyright-author = "Canonical Ltd."
copyright-regexp = "Copyright\\s\\d{4}([-,]\\d{4})*\\s+%(author)s"

[project.optional-dependencies]
# Runtime deps baked into the charm
charm = [
    "cryptography==45.0.3",
    "Jinja2==3.1.4",
    "ops==2.21.1",
    "async-timeout==4.0.3",
    "pydantic>=2.0",  # traefik-k8s ingress, tls-certificates requirement
    "boto3==1.34.31",
    "cosl==0.0.51",
    "requests==2.31.0",
    "openfga-sdk==0.6.0",
]

# Unit test deps
unit = [
    "coverage[toml]==7.5.0",
    "pytest==7.1.3",
    "ipdb==0.13.9",
    "cryptography==45.0.3",
    "cosl==0.0.51",
    "requests==2.31.0",
    "openfga-sdk==0.6.0",
    "ops[testing]==2.21.1",
    "Jinja2==3.1.4",
    "boto3==1.34.31",
]

# Integration test deps
integration = [
    "pytest==7.1.3",
    "pytest-operator==0.31.1",
    "pytest-asyncio==0.21",
    "juju==3.5.2.1",
    "temporalio==1.7.0",
    "grpcio==1.73.1",
    "grpcio-health-checking==1.73.1",
    "ipdb==0.13.9",
    "ops==2.21.1"
]

# Static analysis / linting
lint = [
    "mypy",
    "pylint",
    "pydocstyle",
    "pytest",
    "black==23.12.1",
    "codespell==2.2.5",
    "flake8==7.0.0",
    "flake8-builtins==1.5.3",
    "flake8-copyright==0.2.4",
    "flake8-docstrings==1.6.0",
    "isort==5.12.0",
    "pep8-naming==0.13.2",
    "pyproject-flake8==7.0.0",
    "flake8-docstrings-complete>=1.0.3",
    "flake8-test-docs>=1.0",
    "types-requests",
    "types-PyYAML",
]

# Formatting
fmt = [
    "black==23.12.1",
    "isort==5.12.0",
]
