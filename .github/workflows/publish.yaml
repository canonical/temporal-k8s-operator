name: Publish charm

on:
  push:
    branches:
      - track/**

jobs:
  tests:
    name: Release tests
    uses: ./.github/workflows/integration_test.yaml

  detect-lib-changes:
    name: Detect charm lib changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changes under lib/charms/temporal_k8s
        id: detect
        run: |
          changed=false
          while IFS= read -r file; do
            case "$file" in
              lib/charms/temporal_k8s/*)
                changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  publish:
    name: Release the charm
    needs:
      - tests
    uses: canonical/observability/.github/workflows/_charm-release.yaml@v1
    permissions:
      contents: write
    secrets: inherit
    with:
      release-channel: "1.23/edge"
      charm-path: "."
      charmcraft-channel: "3.x/candidate"
      runners: '["ubuntu-latest"]'

  publish-libs:
    name: Publish charm libs
    needs:
      - tests
      - detect-lib-changes
    if: ${{ needs.detect-lib-changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish changed charm libraries
        uses: canonical/charming-actions/release-libraries@2.7.0
        with:
          credentials: ${{ secrets.CHARMHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          charmcraft-channel: 3.x/candidate
