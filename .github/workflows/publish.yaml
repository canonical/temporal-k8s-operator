name: Publish charm

on:
  push:
    branches:
      - track/**

jobs:
  tests:
    name: Release tests
    uses: ./.github/workflows/tests.yaml
    secrets: inherit

  publish:
    name: 'Publish charm to edge | amd64'
    runs-on: ubuntu-latest
    needs:
      - tests
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Upload charm package
        uses: canonical/charming-actions/upload-charm@2.7.0
        with:
          credentials: ${{ secrets.CHARMHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          channel: 1.31/edge
          tag-prefix: temporal-k8s
          charmcraft-channel: 4.x/stable

  publish-libs:
    name: Publish charm libs
    runs-on: ubuntu-latest
    needs:
      - tests
      - publish
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish changed charm libraries
        uses: canonical/charming-actions/release-libraries@2.7.0
        with:
          credentials: ${{ secrets.CHARMHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          charmcraft-channel: 4.x/stable
