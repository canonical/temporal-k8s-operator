name: Tests

on:
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_call:
    inputs:
      juju-channel:
        description: Juju snap channel the test controllers are bootstrapped from.
        required: false
        type: string
        default: "3.6/stable"
      concierge-config:
        description: Concierge config file used for the ingress test (k8s + lxd providers).
        required: false
        type: string
        default: ".github/workflows/concierge.yaml"
      postgres-channel:
        description: postgresql-k8s channel deployed by the integration tests.
        required: false
        type: string
        default: "14/stable"
      postgres-force:
        description: Deploy postgresql-k8s with --force to skip the base support check.
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The lint/unit/lib-check jobs are skipped when this workflow is invoked on a
  # schedule (e.g. nightly-juju4.yaml): the nightly run is integration-test
  # focused, and scheduled lib-check runs could produce unwanted write actions.
  alertmanager-rules-lint:
    name: Alertmanager rules lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Prometheus
        run: sudo snap install prometheus

      - name: Run promtool checks on Prometheus alert definitions
        run: promtool check rules $(find "$PWD" -name "*_rules.yaml")

  lib-check:
    name: Check libraries
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Check libraries
        id: checklibs
        uses: canonical/charming-actions/check-libraries@2.7.0
        with:
          credentials: "${{ secrets.CHARMHUB_TOKEN }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          charm-path: "."

  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo snap install astral-uv --classic
          sudo snap install just --classic

      - name: Run lint
        run: just lint

  unit-tests:
    name: Unit tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo snap install astral-uv --classic
          sudo snap install just --classic

      - name: Run unit tests
        run: just unit

  integration-tests:
    name: Integration tests (${{ matrix.test }})
    runs-on: [self-hosted-linux-amd64-resolute-large]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_auth
          - test_charm
          - test_host_info
          - test_pgbouncer
          - test_scaling
          - test_server_upgrade
          - test_upgrades
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo snap install concierge --classic

          sudo concierge prepare \
            -p k8s \
            --juju-channel ${{ inputs.juju-channel }} \
            --charmcraft-channel 4.x/stable \
            --extra-snaps="astral-uv,just,kubectl"

          sudo k8s kubectl config view --raw > ~/.kube/config

      - name: Run integration tests
        env:
          POSTGRESQL_CHANNEL: ${{ inputs.postgres-channel }}
          POSTGRESQL_FORCE: ${{ inputs.postgres-force }}
        run: just integration tests/integration/${{ matrix.test }}.py

      - name: Upload Juju debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juju-debug-logs-${{ matrix.test }}
          path: .logs/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Get system state (if failure)
        if: failure()
        run: just get-system-state

  # The ingress test exposes the gRPC frontend through ingress-configurator +
  # HAProxy. HAProxy is a machine charm, so this needs both a Kubernetes and an
  # LXD controller - provisioned from the concierge config file passed via the
  # concierge-config input (default concierge.yaml, which enables both
  # providers) rather than the k8s-only `-p k8s` preset used above.
  ingress-integration-test:
    name: Integration test (ingress)
    runs-on: [self-hosted-linux-amd64-resolute-large]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          # concierge's config-file mode (-c) does not honour the
          # --charmcraft-channel / --extra-snaps preset flags, so the tooling
          # (charmcraft, astral-uv, just, kubectl) is declared under `host.snaps`
          # in concierge.yaml instead and installed by `concierge prepare`.
          sudo snap install concierge --classic

          sudo concierge prepare -c ${{ inputs.concierge-config }}

          sudo k8s kubectl config view --raw > ~/.kube/config

      - name: Run ingress integration test
        env:
          POSTGRESQL_CHANNEL: ${{ inputs.postgres-channel }}
          POSTGRESQL_FORCE: ${{ inputs.postgres-force }}
        run: just integration tests/integration/test_ingress.py

      - name: Upload Juju debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juju-debug-logs-test_ingress
          path: .logs/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Get system state (if failure)
        if: failure()
        run: just get-system-state
