# Juju 4.x variant of concierge.yaml.
#
# Provisions the substrate for the cross-model ingress integration test
# (tests/integration/test_ingress.py) using Juju 4/edge.
#
# The other integration tests only need Kubernetes and are provisioned
# separately with `concierge prepare -p k8s` (see nightly-juju4.yaml);
# they do not read this file.
juju:
  channel: 4/edge
  model-defaults:
    test-mode: "true"
    automatically-retry-hooks: "false"

providers:
  lxd:
    enable: true
    bootstrap: true
  k8s:
    enable: true
    bootstrap: true
    channel: 1.33-classic/stable
    bootstrap-constraints:
      root-disk: "2G"
    features:
      load-balancer:
        l2-mode: "true"
        cidrs: "10.43.45.0/28"
      local-storage: {}
      network: {}

host:
  snaps:
    charmcraft:
      channel: 4.x/stable
    astral-uv:
      channel: latest/stable
    just:
      channel: latest/stable
    kubectl:
      channel: latest/stable
