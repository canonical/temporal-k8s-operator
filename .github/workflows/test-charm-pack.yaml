name: Test charm packaging

on:
  pull_request:
    branches:
      - track/1.31

jobs:
  pack:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Charmcraft
        run: sudo snap install charmcraft --classic --channel 4.x/stable

      - name: Test packaging before apt update
        id: before
        continue-on-error: true
        run: sudo charmcraft pack --verbose --destructive-mode

      - name: Update apt package index
        run: sudo apt-get update

      - name: Check Rust packages
        run: |
          apt-cache policy cargo rustc

      - name: Install Rust packages
        run: sudo apt-get install -y cargo rustc

      - name: Pack charm
        run: sudo charmcraft pack --verbose --destructive-mode
