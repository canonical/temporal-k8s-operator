type: "charm"

platforms:
  ubuntu@24.04:amd64:

parts:
  charm:
    plugin: uv
    source: .
    uv-extras: [charm]
    build-packages:
      - cargo
      - libffi-dev
      - libssl-dev
      - pkg-config
      - rustc
    build-snaps:
      - astral-uv
  templates:
    plugin: dump
    source: ./templates
    organize:
      '*': templates/
    prime:
      - templates/**
