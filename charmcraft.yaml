type: "charm"


platforms:
  ubuntu@26.04:amd64:

parts:
  charm:
    plugin: uv
    source: .
    uv-extras: [charm]
    build-packages:
      - cargo
      - libffi-dev
      - libssl-dev
      - pkg-config
      - rustc
      - python3-venv
    build-snaps:
      - astral-uv
  extras:
    plugin: dump
    source: ./templates
    organize:
      '*': templates/
