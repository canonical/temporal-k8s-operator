name: temporal-k8s
display-name: Temporal Server
summary: Temporal server operator
description: |
  Temporal is a developer-first, open source platform that ensures
  the successful execution of services and applications (using workflows).
maintainers:
  - Workflows Team <workflows-team@groups.canonical.com>
source: https://github.com/canonical/temporal-k8s-operator
docs: https://discourse.charmhub.io/t/temporal-server-documentation-overview/8948
tags:
  - temporal
  - workflow
  - task
  - activities
  - development
issues: https://github.com/canonical/temporal-k8s-operator/issues
assumes:
  - juju >= 3.1
  - k8s-api

peers:
  peer:
    interface: temporal

requires:
  admin:
    interface: temporal
    limit: 1
  db:
    interface: postgresql_client
    limit: 1
  frontend-certificates:
    interface: tls-certificates
    optional: true
    limit: 1
  ingress:
    interface: ingress
    optional: true
    limit: 1
  visibility:
    interface: postgresql_client
    limit: 1
  nginx-route:
    interface: nginx-route
    optional: true
    limit: 1
  ui:
    interface: temporal
    optional: true
    limit: 1
  logging:
    interface: loki_push_api
    optional: true
    limit: 1
  log-proxy:
    interface: loki_push_api
    optional: true
    limit: 1
  openfga:
    interface: openfga
    optional: true
    limit: 1
  s3-parameters:
    interface: s3
    optional: true
    limit: 1

provides:
  metrics-endpoint:
    interface: prometheus_scrape
    optional: true
  grafana-dashboard:
    interface: grafana_dashboard
    optional: true
  temporal-host-info:
    interface: temporal-host-info

containers:
  temporal:
    resource: temporal-server-image

resources:
  temporal-server-image:
    type: oci-image
    description: OCI image for Temporal
    # FIXME: this image comes from the temporal-rock ghcr registry
    # and its purpose is solely to speed up the release of 1.31/edge
    # Must be changed to the one from the canonical Docker for 1.31/stable
    upstream-source: ghcr.io/canonical/temporal-rocks/temporal-server:1.31
