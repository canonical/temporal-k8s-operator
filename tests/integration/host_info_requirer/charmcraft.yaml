name: temporal-host-info-requirer
summary: A test charm for the temporal-host-info relation.
description: This charm is used for testing purposes only.
base: ubuntu@24.04
type: charm
platforms:
  amd64:

parts:
  charm:
    source: .
    build-packages:
      - python3-venv
containers:
  workload:
    resource: workload-image
resources:
  workload-image:
    type: oci-image
    description: Simple web server image
    upstream-source: ghcr.io/canonical/api_demo_server:1.0.2
requires:
  temporal-host-info:
    interface: temporal-host-info
    limit: 1
