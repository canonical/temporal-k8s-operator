name: temporal-host-info-requirer
summary: A test charm for the temporal-host-info relation.
description: This charm is used for testing purposes only.
base: ubuntu@24.04
type: charm
platforms:
  amd64:

parts:
  charm:
    source: .
    build-packages:
      - python3-venv
    charm-binary-python-packages:
      - hatchling
      - pluggy
      - setuptools-scm
      - opentelemetry-api
      - pathspec
requires:
  temporal-host-info:
    interface: temporal-host-info
    limit: 1
